<!DOCTYPE html>
<html>
<head>
    <title>Track Order</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <img src="/static/olist_logo.png" class="logo">
        <h2>Track Your Order</h2>
        <form method="POST">
            <input type="text" name="order_id" placeholder="Enter Order ID" required><br>
            <button type="submit">Track</button>
        </form>

        {% if order %}
        <div class="result">
            <p><strong>Order ID:</strong> {{ order.order_id }}</p>
            <p><strong>Status:</strong> {{ order.status }}</p>
            <p><strong>Estimated Delivery:</strong> {{ order.delivery_date }}</p>
            <p><strong>Product:</strong> {{ order.product_name }}</p>
            <p><strong>Company:</strong> {{ order.company }}</p>
            <p><strong>Email:</strong> {{ order.email }}</p>
        </div>
        {% elif error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <a href="/logout" class="logout">Logout</a>
    </div>
</body>
</html>
